name: payram-hardened

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - db_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payram}
      POSTGRES_USER: ${POSTGRES_USER:-payram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  payram:
    # Imagen propietaria de PayRam. NO se redistribuye en este repositorio.
    image: ${PAYRAM_IMAGE:-payramapp/payram@sha256:1181cd5d886a50d68565c275dad231d9a1d75735dca3ce5873f334c2f9db3791}
    restart: unless-stopped
    entrypoint: ["/hardening/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    networks:
      - payram_net
      - db_net
    environment:
      AES_KEY: ${AES_KEY:?AES_KEY es obligatorio}
      SSL_CERT_PATH: ""
      BLOCKCHAIN_NETWORK_TYPE: ${PAYRAM_NETWORK_TYPE:-mainnet}
      SERVER: ${PAYRAM_SERVER:-PRODUCTION}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: ${POSTGRES_DB:-payram}
      POSTGRES_USERNAME: ${POSTGRES_USER:-payram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      POSTGRES_SSLMODE: prefer
      PAYMENTS_APP_SERVER_URL: "https://x.payram.com"

      # Hardening
      PAYRAM_HARDENING_ENABLED: "true"
      INTERNAL_POSTGRES_PASSWORD: ${INTERNAL_POSTGRES_PASSWORD:?INTERNAL_POSTGRES_PASSWORD es obligatorio}
      PAYRAM_AUTO_APPROVE: ${PAYRAM_AUTO_APPROVE:-false}
      PAYRAM_AUTO_APPROVE_USD: ${PAYRAM_AUTO_APPROVE_USD:-0}
      PAYRAM_OTP_THRESHOLD_USD: ${PAYRAM_OTP_THRESHOLD_USD:-0}
      PAYRAM_DAILY_LIMIT_USD: ${PAYRAM_DAILY_LIMIT_USD:-1000}
      PAYRAM_HOURLY_LIMIT_USD: ${PAYRAM_HOURLY_LIMIT_USD:-500}
    volumes:
      - ./hardening:/hardening:ro
      - payram_data:/root/payram
      - payram_logs:/var/log
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *default-logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - payram_net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PAYRAM_DOMAIN: ${PAYRAM_DOMAIN:?PAYRAM_DOMAIN es obligatorio}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL es obligatorio}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      payram:
        condition: service_healthy
    logging: *default-logging

networks:
  payram_net:
  db_net:
    internal: true

volumes:
  pg_data:
  payram_data:
  payram_logs:
  caddy_data:
  caddy_config:
